[tool.poetry]
name = "relevance-silver-pipeline"
version = "0.1.0"
description = "Silver-layer company enrichment pipeline: Firecrawl datapoint extractors + SilverOrchestrator quality gate."
authors = ["Eve <eve@relevanceai.io>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
streamlit = ">=1.32"
pandas = ">=2.0"
python-dateutil = ">=2.8"
pandera = ">=0.20"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
playwright = ">=1.40"

[tool.pytest.ini_options]
# Extended 2026-09-08 to cover client_context/ and bronze/clay/ (new -
# see their own docstrings) alongside the original silver/ scope.
testpaths = ["silver", "client_context", "bronze"]
python_files = ["test_*.py"]
# package-mode=false means "silver" is never pip-installed - without this,
# `poetry run pytest` (invoked as a console-script, unlike `python -m
# pytest`) never gets the repo root on sys.path, and `from silver.firecrawl
# import Firecrawl` fails with ModuleNotFoundError.
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
